[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-meta-argument"
version = "0.1.0"
description = "Deterministic structural scoring engine for the Theophysics Master Equation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Theophysics Research Initiative"}]
dependencies = []

[project.scripts]
meta-score = "meta_argument.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
